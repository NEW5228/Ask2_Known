task:
  name: fruit_demo
  type: image_object_recognition
  description: 通用任务配置示例：水果细分类主动教学识别

paths:
  dataset_dir: datasets/fruit_demo
  output_dir: outputs/fruit_demo

features:
  color: true
  size: true
  contour: true
  texture: true

learning:
  initial_weights:
    color: 0.25
    # 单独图片里物体大小容易受拍摄距离影响，所以 v0.3 默认降低 size 权重。
    size: 0.15
    contour: 0.30
    texture: 0.30
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.70

confidence:
  auto_accept_threshold: 0.80
  ask_user_threshold: 0.12

question:
  max_questions_per_sample: 1
  enable_question_reward: true

teaching:
  allow_region_seed: false
  max_seed_annotations_per_class: 2
