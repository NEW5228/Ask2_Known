task:
  name: my_fruit_task
  type: image_object_recognition
  description: 用户自定义 Ask2Know 任务

paths:
  dataset_dir: datasets/my_fruit_task
  output_dir: outputs/my_fruit_task

features:
  color: true
  size: true
  contour: true
  texture: true

learning:
  initial_weights:
    color: 0.25
    size: 0.15
    contour: 0.30
    texture: 0.30
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.70

confidence:
  auto_accept_threshold: 0.80
  ask_user_threshold: 0.12

question:
  max_questions_per_sample: 1
  enable_question_reward: true

teaching:
  allow_region_seed: false
  max_seed_annotations_per_class: 2
