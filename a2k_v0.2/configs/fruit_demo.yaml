task:
  name: fruit_demo
  type: image_object_recognition

paths:
  dataset_dir: datasets/fruit_demo
  output_dir: outputs/fruit_demo

features:
  color: true
  size: true
  contour: true
  texture: true

learning:
  initial_weights:
    color: 0.25
    size: 0.25
    contour: 0.25
    texture: 0.25
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.70

confidence:
  auto_accept_threshold: 0.80
  ask_user_threshold: 0.12

question:
  max_questions_per_sample: 1
  enable_question_reward: true
