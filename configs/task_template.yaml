task:
  name: your_task_name
  type: image_object_recognition
  description: 用户自定义 Ask2Know 任务

paths:
  project_root: D:/a2k_test/your_task_name
  dataset_dir: D:/a2k_test/your_task_name/datasets
  output_dir: D:/a2k_test/your_task_name/outputs

classes:
  - class_a
  - class_b

features:
  preset: fruit
  groups:
    color: true
    shape: true
    texture: true
    surface: true
    part: true
    size: true
    text: false
    sign: false
  system:
    quality: true

concepts:
  enable: true
  score_weight: 0.25

deep_features:
  enable: true
  provider: opencv
  feature_name: image_embedding
  cache: true
  fallback_to_opencv: true
  include_augmented: false

similarity:
  mode: hybrid
  knn:
    enable: true
    k: 3
    score_weight: 0.20

learning:
  initial_weights:
    color: 0.28
    shape: 0.32
    texture: 0.25
    surface: 0.16
    part: 0.12
    size: 0.05
    embedding: 0.22
  default_feature_weight: 0.08
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.70

confidence:
  auto_accept_threshold: 0.88
  ask_user_threshold: 0.12
  global_uncertainty_spread: 0.08
  global_uncertainty_top_n: 5
  saturation_ratio_threshold: 0.65

question:
  max_questions_per_sample: 1
  enable_question_reward: true

sample_pool:
  enable: true
  require_confirm_before_learning: true
  move_unlabeled_after_decision: true

train_import:
  auto_rename: true

unlabeled_import:
  auto_rename: true

augmentation:
  enable: true
  brightness: true
  rotation: true
  crop: true
  blur: false

future_modules:
  crawler_external_candidates: planned
  visual_concept_layer: planned
  deep_feature_adapter: enabled

teaching:
  allow_region_seed: false
  max_seed_annotations_per_class: 2
