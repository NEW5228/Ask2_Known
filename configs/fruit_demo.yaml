task:
  name: fruit_demo
  type: image_object_recognition
  description: 内置水果演示任务

paths:
  project_root: datasets/fruit_demo_project
  dataset_dir: datasets/fruit_demo
  output_dir: outputs/fruit_demo

classes:
  - apple
  - strawberry

features:
  preset: fruit
  groups:
    color: true
    shape: true
    texture: true
    surface: true
    size: true
    text: false
    sign: false
  system:
    quality: true

concepts:
  enable: true
  score_weight: 0.25

learning:
  initial_weights:
    color: 0.28
    shape: 0.32
    texture: 0.25
    surface: 0.16
    size: 0.05
  default_feature_weight: 0.08
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.70

confidence:
  auto_accept_threshold: 0.88
  ask_user_threshold: 0.12
  global_uncertainty_spread: 0.08
  global_uncertainty_top_n: 5
  saturation_ratio_threshold: 0.65

question:
  max_questions_per_sample: 1
  enable_question_reward: true

sample_pool:
  enable: true
  require_confirm_before_learning: true
  move_unlabeled_after_decision: true

train_import:
  auto_rename: true

unlabeled_import:
  auto_rename: true

augmentation:
  enable: true
  brightness: true
  rotation: true
  crop: true
  blur: false

future_modules:
  crawler_external_candidates: planned
  visual_concept_layer: planned
  deep_feature_adapter: planned

teaching:
  allow_region_seed: false
  max_seed_annotations_per_class: 2
