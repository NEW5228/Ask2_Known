task:
  name: fruit_demo
  type: image_object_recognition
  description: 内置水果演示任务

paths:
  project_root: datasets/fruit_demo_project
  dataset_dir: datasets/fruit_demo
  output_dir: outputs/fruit_demo

classes:
  - apple
  - strawberry

features:
  preset: fruit
  groups:
    color: true
    shape: true
    texture: true
    surface: true
    part: true
    size: true
    text: false
    sign: false
  system:
    quality: true

concepts:
  enable: true
  score_weight: 0.05

deep_features:
  enable: true
  provider: open_clip
  model_name: ViT-B-32
  pretrained: laion2b_s34b_b79k
  device: auto
  feature_name: image_embedding
  cache: true
  fallback_to_opencv: false
  include_augmented: false
  multi_crop:
    enable: true
    crops:
      - full
      - center
      - five_crop
      - object
      - head
    center_ratio: 0.86
    corner_ratio: 0.72

similarity:
  mode: hybrid
  knn:
    enable: true
    k: 3
    score_weight: 0.20
  sub_prototypes:
    enable: true
    max_centers: 3
    min_samples_per_center: 8
    score_weight: 0.06
    mode: conservative
    min_gain_over_prototype: 0.015
    min_top_gap: 0.0
    allow_rank_flip: true
    max_base_margin_for_flip: 0.010
    rank_flip_prototype_veto_margin: 0.003
  text_semantic:
    enable: true
    score_weight: 0.08
    prompt_templates:
      - "a photo of a {label}"
      - "a close-up photo of a {label}"
  pairwise_rerank:
    enable: true
    local_k: 5
    score_weight: 0.25
    max_score_margin: 0.018
    min_pair_similarity: 0.90
    min_local_gap: 0.008
  crop_rerank:
    enable: true
    max_candidate_classes: 3
    local_k: 5
    score_weight: 0.18
    max_score_margin: 0.018
    min_pair_similarity: 0.94
    min_local_gap: 0.006
    use_full_crop: false
    trigger_mode: margin_and_pair_similarity
  late_fusion:
    enable: true
    max_candidate_classes: 3
    weights:
      base_score: 1.0
      knn_score: 0.8
      text_semantic_score: 0.8
      crop_rerank_score: 0.4
  hierarchy:
    enable: false
    parser: auto
    max_candidate_classes: 12
    min_group_size: 1
    score_weight: 0.08
    max_score_margin: 0.060
    min_gap: 0.0
    level_weights:
      level_1: 0.40
      level_2: 0.35
      level_3: 0.25
  robust_prototype:
    enable: true
    deep_only: true
    min_samples: 24
    trim_fraction: 0.08
    report_margin: 0.015
    top_outliers_per_class: 5
  concept_gate:
    enable: true
    min_top_gap: 0.035
    weak_score_weight: 0.00

diagnostics:
  low_margin_threshold: 0.015
  weak_signal_threshold: 0.005

validation:
  pass_accuracy_threshold: 0.85

learning:
  initial_weights:
    color: 0.03
    shape: 0.03
    texture: 0.03
    surface: 0.03
    part: 0.03
    size: 0.02
    embedding: 5.00
  default_feature_weight: 0.08
  update_step: 0.07
  min_weight: 0.05
  max_weight: 0.95

confidence:
  auto_accept_threshold: 0.88
  ask_user_threshold: 0.03
  global_uncertainty_spread: 0.08
  global_uncertainty_top_n: 5
  saturation_ratio_threshold: 0.65

question:
  max_questions_per_sample: 1
  enable_question_reward: true

sample_pool:
  enable: true
  require_confirm_before_learning: true
  move_unlabeled_after_decision: true

train_import:
  auto_rename: true

unknown_import:
  auto_rename: true

unlabeled_import:
  auto_rename: false

augmentation:
  enable: true
  brightness: true
  rotation: true
  crop: true
  blur: false

future_modules:
  crawler_external_candidates: planned
  visual_concept_layer: planned
  deep_feature_adapter: enabled

teaching:
  allow_region_seed: false
  max_seed_annotations_per_class: 2
